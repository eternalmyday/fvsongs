<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Favorite Songs</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f7f9;
  color:#252525;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
}

.wrap{
  max-width:720px;
  margin:0 auto;
  padding:18px 12px 50px;
}

.card{
  background:#fff;
  border:1px solid #e8e8eb;
  border-radius:14px;
  padding:14px;
  box-shadow:0 3px 14px rgba(0,0,0,.025);
}

.card + .card{
  margin-top:12px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

h1{
  margin:0;
  font-size:19px;
}

h2{
  margin:0;
  font-size:15px;
}

.sub{
  font-size:11px;
  color:#90949a;
}

.btn{
  border:0;
  background:#f1f2f4;
  color:#333;
  border-radius:8px;
  padding:7px 10px;
  font-size:11px;
  cursor:pointer;
}

.people{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.person{
  min-width:0;
  border:1px solid #eeeeef;
  border-radius:11px;
  padding:10px;
  background:#fff;
}

.person-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:7px;
  font-size:12px;
  font-weight:700;
}

.song-row{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
  height:42px;
  border-top:1px solid #f1f1f2;
}

.song-row:first-of-type{
  border-top:0;
}

.cover{
  width:30px;
  height:30px;
  border-radius:5px;
  object-fit:cover;
  flex:0 0 auto;
  background:#ececec;
}

.song-text{
  min-width:0;
  flex:1;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.empty{
  font-size:11px;
  color:#a0a3a8;
  padding:9px 0;
}

.filters{
  display:flex;
  gap:5px;
  margin-bottom:8px;
}

.filter{
  border:0;
  padding:6px 9px;
  border-radius:999px;
  background:#f1f2f4;
  color:#555;
  font-size:10.5px;
  cursor:pointer;
}

.filter.on{
  background:#222;
  color:#fff;
}

.archive-row{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  gap:7px;
  align-items:center;
  min-height:36px;
  border-top:1px solid #f1f1f2;
  font-size:11.5px;
}

.archive-row:first-child{
  border-top:0;
}

.who{
  border-radius:5px;
  background:#f0f1f3;
  padding:3px 5px;
  white-space:nowrap;
  font-size:10.5px;
  font-weight:700;
}

.archive-song{
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.archive-date{
  color:#858a91;
  white-space:nowrap;
  font-size:10.5px;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.34);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:20;
}

.overlay.open{
  display:flex;
}

.sheet{
  width:min(720px,100%);
  max-height:78vh;
  background:#fff;
  border-radius:18px 18px 0 0;
  padding:14px;
  overflow:auto;
}

.sheet-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.search{
  width:100%;
  border:1px solid #dedfe3;
  border-radius:10px;
  padding:10px 11px;
  font-size:13px;
  outline:none;
}

.result{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 0;
  border-top:1px solid #f0f0f1;
  cursor:pointer;
}

.result:first-child{
  border-top:0;
}

.result .cover{
  width:38px;
  height:38px;
}

.result-main{
  min-width:0;
  flex:1;
}

.result-title{
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.result-sub{
  margin-top:2px;
  font-size:10px;
  color:#888;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.hint{
  font-size:10px;
  color:#999;
  margin:8px 1px;
}

@media(max-width:460px){

  .wrap{
    padding-left:10px;
    padding-right:10px;
  }

  .card{
    padding:12px;
  }

  .people{
    gap:7px;
  }

  .person{
    padding:8px;
  }

  .cover{
    width:28px;
    height:28px;
  }

  .song-text{
    font-size:10.5px;
  }

  .archive-row{
    gap:5px;
    font-size:11px;
  }

  .archive-date{
    font-size:10px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="head">
    <div>
      <h1>요즘 최애곡</h1>
      <div class="sub">각자 최대 2곡</div>
    </div>
  </div>

  <section class="card">

    <div class="people">

      <div class="person">

        <div class="person-title">
          <span>나</span>
          <button class="btn" onclick="openSearch('나')">
            + 등록
          </button>
        </div>

        <div id="mySongs"></div>

      </div>

      <div class="person">

        <div class="person-title">
          <span>친구</span>
          <button class="btn" onclick="openSearch('친구')">
            + 등록
          </button>
        </div>

        <div id="friendSongs"></div>

      </div>

    </div>

  </section>


  <section class="card">

    <div class="head">
      <h2>보관함</h2>
      <div class="sub">최신순</div>
    </div>

    <div class="filters">

      <button
        class="filter on"
        onclick="setFilter('전체',this)"
      >
        전체
      </button>

      <button
        class="filter"
        onclick="setFilter('나',this)"
      >
        나
      </button>

      <button
        class="filter"
        onclick="setFilter('친구',this)"
      >
        친구
      </button>

    </div>

    <div id="archive"></div>

  </section>

</div>


<div
  id="overlay"
  class="overlay"
  onclick="overlayClose(event)"
>

  <div class="sheet">

    <div class="sheet-top">

      <strong id="sheetTitle">
        곡 검색
      </strong>

      <button
        class="btn"
        onclick="closeSearch()"
      >
        닫기
      </button>

    </div>

    <input
      id="searchInput"
      class="search"
      type="text"
      placeholder="아티스트 또는 곡명 검색"
      autocomplete="off"
    >

    <div class="hint">
      Apple iTunes Store 음원 검색
    </div>

    <div id="results"></div>

  </div>

</div>


<script>

let current = {

  "나":[
    {
      artist:"DAY6",
      title:"HAPPY",
      cover:"",
      start:"2026-09-04"
    },
    {
      artist:"DAY6",
      title:"Welcome to the Show",
      cover:"",
      start:"2026-09-07"
    }
  ],

  "친구":[
    {
      artist:"aespa",
      title:"Whiplash",
      cover:"",
      start:"2026-09-03"
    }
  ]

};


let archive = [

  {
    who:"나",
    artist:"DAY6",
    title:"예뻤어",
    start:"2026-08-29",
    end:"2026-09-04"
  },

  {
    who:"친구",
    artist:"NCT WISH",
    title:"Songbird",
    start:"2026-08-27",
    end:"2026-09-03"
  },

  {
    who:"나",
    artist:"IU",
    title:"Love wins all",
    start:"2026-08-20",
    end:"2026-08-29"
  }

];


let activeWho = "나";

let activeFilter = "전체";

let searchTimer = null;

let searchResults = [];

let searchTimeout = null;


function esc(s=""){

  return String(s).replace(
    /[&<>"']/g,
    function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];

    }
  );

}


function md(date){

  const d =
    new Date(
      date + "T00:00:00"
    );

  return (
    (d.getMonth()+1)
    +
    "/"
    +
    d.getDate()
  );

}


function duration(start,end){

  const a =
    new Date(
      start + "T00:00:00"
    );

  const b =
    new Date(
      end + "T00:00:00"
    );

  return Math.max(
    1,
    Math.round(
      (b-a) / 86400000
    ) + 1
  );

}


function todayISO(){

  const d =
    new Date();

  const year =
    d.getFullYear();

  const month =
    String(
      d.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      d.getDate()
    ).padStart(2,"0");

  return (
    year
    +
    "-"
    +
    month
    +
    "-"
    +
    day
  );

}


function renderCurrent(){

  const people = [

    ["나","mySongs"],

    ["친구","friendSongs"]

  ];


  people.forEach(
    function(item){

      const who =
        item[0];

      const id =
        item[1];

      const el =
        document.getElementById(id);

      const songs =
        current[who];


      if(!songs.length){

        el.innerHTML =
          '<div class="empty">등록된 곡 없음</div>';

        return;

      }


      el.innerHTML =
        songs.map(
          function(song){

            return `

              <div class="song-row">

                ${
                  song.cover
                  ?
                  `<img
                    class="cover"
                    src="${esc(song.cover)}"
                    alt=""
                  >`
                  :
                  `<div class="cover"></div>`
                }

                <div class="song-text">
                  ${esc(song.artist)} - ${esc(song.title)}
                </div>

              </div>

            `;

          }
        ).join("");

    }
  );

}


function renderArchive(){

  const data =
    archive.filter(
      function(item){

        return (
          activeFilter === "전체"
          ||
          item.who === activeFilter
        );

      }
    );


  const el =
    document.getElementById(
      "archive"
    );


  if(!data.length){

    el.innerHTML =
      '<div class="empty">보관된 곡이 없어요.</div>';

    return;

  }


  el.innerHTML =
    data.map(
      function(item){

        return `

          <div class="archive-row">

            <span class="who">
              ${esc(item.who)}
            </span>

            <span class="archive-song">
              ${esc(item.artist)} - ${esc(item.title)}
            </span>

            <span class="archive-date">
              ${md(item.start)}~${md(item.end)}
              (${duration(item.start,item.end)}일)
            </span>

          </div>

        `;

      }
    ).join("");

}


function setFilter(filter,button){

  activeFilter =
    filter;


  document
    .querySelectorAll(".filter")
    .forEach(
      function(btn){

        btn.classList.remove("on");

      }
    );


  button.classList.add("on");


  renderArchive();

}


function openSearch(who){

  activeWho =
    who;


  document.getElementById(
    "sheetTitle"
  ).textContent =
    who + " · 곡 검색";


  document.getElementById(
    "searchInput"
  ).value =
    "";


  document.getElementById(
    "results"
  ).innerHTML =
    '<div class="empty">아티스트 또는 곡명을 입력하세요.</div>';


  document.getElementById(
    "overlay"
  ).classList.add("open");


  setTimeout(
    function(){

      document.getElementById(
        "searchInput"
      ).focus();

    },
    100
  );

}


function closeSearch(){

  document.getElementById(
    "overlay"
  ).classList.remove("open");

}


function overlayClose(event){

  if(
    event.target.id === "overlay"
  ){

    closeSearch();

  }

}


window.itunesCallback =
function(data){

  clearTimeout(
    searchTimeout
  );


  const raw =
    (
      data
      &&
      data.results
    )
    ?
    data.results
    :
    [];


  const songs =
    raw.filter(
      function(item){

        return (
          item.kind === "song"
          &&
          item.artistName
          &&
          item.trackName
        );

      }
    );


  const seen =
    new Set();


  searchResults =
    songs.filter(
      function(item){

        const key =
          item.artistName.toLowerCase()
          +
          "|||"
          +
          item.trackName.toLowerCase();


        if(
          seen.has(key)
        ){

          return false;

        }


        seen.add(key);

        return true;

      }
    ).map(
      function(item){

        return {

          artist:
            item.artistName,

          title:
            item.trackName,

          album:
            item.collectionName || "",

          cover:
            item.artworkUrl100
            ?
            item.artworkUrl100.replace(
              "100x100bb",
              "300x300bb"
            )
            :
            ""

        };

      }
    );


  renderResults();


  const script =
    document.getElementById(
      "itunesScript"
    );


  if(script){

    script.remove();

  }

};


function searchItunes(){

  const query =
    document.getElementById(
      "searchInput"
    ).value.trim();


  if(!query){

    searchResults =
      [];


    document.getElementById(
      "results"
    ).innerHTML =
      '<div class="empty">아티스트 또는 곡명을 입력하세요.</div>';


    return;

  }


  document.getElementById(
    "results"
  ).innerHTML =
    '<div class="empty">검색 중…</div>';


  const old =
    document.getElementById(
      "itunesScript"
    );


  if(old){

    old.remove();

  }


  clearTimeout(
    searchTimeout
  );


  const script =
    document.createElement(
      "script"
    );


  script.id =
    "itunesScript";


  script.src =
    "https://itunes.apple.com/search"
    +
    "?term="
    +
    encodeURIComponent(query)
    +
    "&country=KR"
    +
    "&media=music"
    +
    "&entity=musicTrack"
    +
    "&limit=100"
    +
    "&callback=itunesCallback"
    +
    "&_="
    +
    Date.now();


  script.onerror =
  function(){

    clearTimeout(
      searchTimeout
    );


    document.getElementById(
      "results"
    ).innerHTML =
      '<div class="empty">검색 API를 불러오지 못했어요.</div>';

  };


  searchTimeout =
    setTimeout(
      function(){

        const result =
          document.getElementById(
            "results"
          );


        if(
          result.textContent.includes(
            "검색 중"
          )
        ){

          result.innerHTML =
            '<div class="empty">API 응답이 없어요.</div>';

        }

      },
      7000
    );


  document.body.appendChild(
    script
  );

}


function scheduleSearch(){

  clearTimeout(
    searchTimer
  );


  searchTimer =
    setTimeout(
      searchItunes,
      450
    );

}


function renderResults(){

  const el =
    document.getElementById(
      "results"
    );


  if(
    !searchResults.length
  ){

    el.innerHTML =
      '<div class="empty">검색 결과 없음</div>';

    return;

  }


  el.innerHTML =
    searchResults.map(
      function(song,index){

        return `

          <div
            class="result"
            onclick="selectSong(${index})"
          >

            ${
              song.cover
              ?
              `<img
                class="cover"
                src="${esc(song.cover)}"
                alt=""
              >`
              :
              `<div class="cover"></div>`
            }

            <div class="result-main">

              <div class="result-title">
                ${esc(song.artist)} - ${esc(song.title)}
              </div>

              <div class="result-sub">
                ${esc(song.album)}
              </div>

            </div>

          </div>

        `;

      }
    ).join("");

}


function selectSong(index){

  const song =
    searchResults[index];


  if(!song){

    return;

  }


  const list =
    current[activeWho];


  const duplicate =
    list.some(
      function(item){

        return (
          item.artist === song.artist
          &&
          item.title === song.title
        );

      }
    );


  if(duplicate){

    alert(
      "이미 현재 최애곡에 등록된 곡이에요."
    );

    return;

  }


  if(
    list.length >= 2
  ){

    const change =
      confirm(
        activeWho
        +
        "의 최애곡이 이미 2곡입니다.\n"
        +
        "가장 오래된 곡을 보관함으로 옮기고 교체할까요?"
      );


    if(!change){

      return;

    }


    const old =
      list.shift();


    archive.unshift({

      who:
        activeWho,

      artist:
        old.artist,

      title:
        old.title,

      start:
        old.start,

      end:
        todayISO()

    });

  }


  list.push({

    artist:
      song.artist,

    title:
      song.title,

    cover:
      song.cover,

    start:
      todayISO()

  });


  renderCurrent();

  renderArchive();

  closeSearch();

}


document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    scheduleSearch
  );


renderCurrent();

renderArchive();

</script>

</body>
</html>
