<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Favorite Songs</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f7f9;
  color:#252525;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
}

.wrap{
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:18px 10px 50px;
}

.card{
  background:#fff;
  border:1px solid #e8e8eb;
  border-radius:14px;
  padding:12px;
}

.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

h1{
  margin:0;
  font-size:18px;
}

.count{
  color:#999;
  font-size:11px;
}


/* =========================
   PLAYLIST
========================= */

.song{
  display:flex;
  align-items:center;
  gap:8px;

  min-width:0;
  height:52px;

  border-top:1px solid #f0f0f1;
}

.song:first-child{
  border-top:0;
}

.cover{
  width:38px;
  height:38px;
  flex:0 0 38px;

  object-fit:cover;

  border-radius:6px;
  background:#eee;
}

.cover-placeholder{
  width:38px;
  height:38px;
  flex:0 0 38px;

  border-radius:6px;
  background:#eee;
}

.song-info{
  flex:1;
  min-width:0;
}

.song-title{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  font-size:12px;
}

.duration{
  flex:0 0 auto;

  color:#929292;
  font-size:10px;

  font-variant-numeric:tabular-nums;
}

.play{
  width:29px;
  height:29px;
  flex:0 0 29px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 0 0 2px;

  border:0;
  border-radius:50%;

  background:#222;
  color:#fff;

  font-size:10px;

  cursor:pointer;
}

.play.playing{
  padding:0;
}

.play:disabled{
  background:#ccc;
  cursor:default;
}

.add{
  width:100%;

  margin-top:9px;
  padding:9px;

  border:0;
  border-radius:9px;

  background:#f1f2f4;
  color:#333;

  font-size:11px;

  cursor:pointer;
}

.empty{
  padding:20px 0;

  color:#999;

  text-align:center;

  font-size:11px;
}


/* =========================
   SHEET
========================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;

  display:none;
  align-items:flex-end;
  justify-content:center;

  background:rgba(0,0,0,.35);
}

.overlay.open{
  display:flex;
}

.sheet{
  width:min(720px,100%);
  max-height:82vh;

  overflow:auto;

  padding:14px;

  background:#fff;

  border-radius:18px 18px 0 0;
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:10px;
}

.sheet-title{
  font-size:14px;
  font-weight:700;
}

.close{
  padding:6px 9px;

  border:0;
  border-radius:8px;

  background:#f1f2f4;
  color:#333;

  font-size:11px;

  cursor:pointer;
}

.search{
  width:100%;

  padding:10px 11px;

  border:1px solid #ddd;
  border-radius:10px;

  outline:none;

  font-size:13px;
}

.search:focus{
  border-color:#aaa;
}

.hint{
  margin:7px 1px 9px;

  color:#999;

  font-size:10px;
}


/* =========================
   SEARCH RESULTS
========================= */

.result{
  display:flex;
  align-items:center;

  gap:9px;

  min-width:0;

  padding:8px 0;

  border-top:1px solid #f0f0f1;

  cursor:pointer;
}

.result:first-child{
  border-top:0;
}

.result:hover{
  background:#fafafa;
}

.result-icon{
  width:40px;
  height:40px;
  flex:0 0 40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:6px;

  background:#f0f0f2;

  color:#aaa;

  font-size:14px;
}

.result-info{
  flex:1;
  min-width:0;
}

.result-title{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  font-size:12px;
}

.result-album{
  margin-top:3px;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  color:#999;

  font-size:10px;
}

.result-time{
  flex:0 0 auto;

  color:#999;

  font-size:10px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:460px){

  .wrap{
    padding:14px 10px 40px;
  }

  .card{
    padding:11px;
  }

  .song{
    height:48px;
    gap:7px;
  }

  .cover,
  .cover-placeholder{
    width:35px;
    height:35px;
    flex-basis:35px;
  }

  .song-title{
    font-size:11px;
  }

  .duration{
    font-size:10px;
  }

  .play{
    width:27px;
    height:27px;
    flex-basis:27px;
  }

}
</style>
</head>

<body>


<div class="wrap">

  <section class="card">

    <div class="head">

      <h1>
        좋아하는 곡
      </h1>

      <span
        class="count"
        id="count"
      >
        0곡
      </span>

    </div>


    <div id="songList"></div>


    <button
      class="add"
      type="button"
      onclick="openSearch()"
    >
      + 곡 추가
    </button>

  </section>

</div>



<div
  class="overlay"
  id="overlay"
  onclick="overlayClick(event)"
>

  <div class="sheet">

    <div class="sheet-head">

      <div class="sheet-title">
        곡 추가
      </div>

      <button
        class="close"
        type="button"
        onclick="closeSearch()"
      >
        닫기
      </button>

    </div>


    <input
      class="search"
      id="searchInput"
      type="search"
      placeholder="아티스트 또는 곡명 검색"
      autocomplete="off"
    >


    <div class="hint">
      검색 결과를 누르면 플레이리스트에 추가됩니다.
    </div>


    <div id="results">

      <div class="empty">
        곡을 검색해보세요.
      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   DATA
========================= */

let songs = [];

let searchResults = [];

let searchTimer = null;

let searchController = null;

let itunesTimeout = null;

let currentAudio = null;

let currentButton = null;

let pendingSong = null;


/* =========================
   UTILS
========================= */

function esc(value=""){

  return String(value).replace(
    /[&<>"']/g,
    function(char){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char];

    }
  );

}


function formatTime(ms){

  if(!ms){
    return "";
  }

  const seconds =
    Math.round(ms / 1000);

  const min =
    Math.floor(seconds / 60);

  const sec =
    String(seconds % 60)
      .padStart(2,"0");

  return min + ":" + sec;

}


function normalize(value){

  return String(value || "")
    .toLowerCase()
    .normalize("NFKD")
    .replace(/\([^)]*\)/g,"")
    .replace(/\[[^\]]*\]/g,"")
    .replace(/[^a-z0-9가-힣]/g,"");

}


/* =========================
   PLAYLIST
========================= */

function renderSongs(){

  const list =
    document.getElementById("songList");


  document.getElementById("count")
    .textContent =
    songs.length + "곡";


  if(!songs.length){

    list.innerHTML =
      '<div class="empty">아직 추가한 곡이 없어요.</div>';

    return;

  }


  list.innerHTML =
    songs.map(function(song,index){

      const coverHTML =
        song.cover

        ? `
          <img
            class="cover"
            src="${esc(song.cover)}"
            alt=""
          >
        `

        : `
          <div class="cover-placeholder"></div>
        `;


      return `

        <div class="song">

          ${coverHTML}

          <div class="song-info">

            <div class="song-title">
              ${esc(song.artist)} - ${esc(song.title)}
            </div>

          </div>


          <span class="duration">
            ${esc(song.duration || "")}
          </span>


          <button
            class="play"
            type="button"
            onclick="playSong(${index},this)"
            ${song.preview ? "" : "disabled"}
            aria-label="재생"
          >
            ▶
          </button>

        </div>

      `;

    }).join("");

}


/* =========================
   PLAYER
========================= */

function stopCurrent(){

  if(currentAudio){

    currentAudio.pause();

    currentAudio = null;

  }


  if(currentButton){

    currentButton.textContent =
      "▶";

    currentButton.classList.remove(
      "playing"
    );

    currentButton = null;

  }

}


function playSong(index,button){

  const song =
    songs[index];


  if(!song.preview){
    return;
  }


  if(
    currentAudio &&
    currentButton === button
  ){

    if(currentAudio.paused){

      currentAudio.play();

      button.textContent =
        "Ⅱ";

      button.classList.add(
        "playing"
      );

    }else{

      currentAudio.pause();

      button.textContent =
        "▶";

      button.classList.remove(
        "playing"
      );

    }

    return;

  }


  stopCurrent();


  currentAudio =
    new Audio(song.preview);


  currentButton =
    button;


  currentAudio.play()
    .then(function(){

      button.textContent =
        "Ⅱ";

      button.classList.add(
        "playing"
      );

    })
    .catch(function(){

      stopCurrent();

    });


  currentAudio.addEventListener(
    "ended",
    stopCurrent
  );

}


/* =========================
   OPEN / CLOSE
========================= */

function openSearch(){

  document.getElementById("overlay")
    .classList.add("open");


  const input =
    document.getElementById("searchInput");


  input.value = "";


  searchResults = [];


  document.getElementById("results")
    .innerHTML =
    '<div class="empty">곡을 검색해보세요.</div>';


  setTimeout(function(){

    input.focus();

  },100);

}


function closeSearch(){

  document.getElementById("overlay")
    .classList.remove("open");

}


function overlayClick(event){

  if(event.target.id === "overlay"){

    closeSearch();

  }

}


/* =========================
   MUSICBRAINZ SEARCH
========================= */

async function searchMusicBrainz(){

  const query =
    document.getElementById("searchInput")
      .value
      .trim();


  if(!query){

    searchResults = [];

    document.getElementById("results")
      .innerHTML =
      '<div class="empty">곡을 검색해보세요.</div>';

    return;

  }


  if(searchController){

    searchController.abort();

  }


  searchController =
    new AbortController();


  document.getElementById("results")
    .innerHTML =
    '<div class="empty">검색 중...</div>';


  try{

    const url =
      "https://musicbrainz.org/ws/2/recording/?" +
      new URLSearchParams({

        query:query,

        fmt:"json",

        limit:"50"

      }).toString();


    const response =
      await fetch(
        url,
        {
          signal:
            searchController.signal,

          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    if(!response.ok){

      throw new Error(
        "MusicBrainz HTTP "
        +
        response.status
      );

    }


    const data =
      await response.json();


    searchResults =
      (
        data.recordings || []
      )

      .map(function(item){

        const credits =
          item["artist-credit"] || [];


        const artist =
          credits
            .map(function(credit){

              return credit.name || "";

            })
            .filter(Boolean)
            .join(", ");


        let album = "";


        if(
          item.releases &&
          item.releases.length
        ){

          album =
            item.releases[0].title || "";

        }


        return {

          mbid:
            item.id || "",

          artist:
            artist,

          title:
            item.title || "",

          album:
            album,

          duration:
            item.length
              ? formatTime(item.length)
              : ""

        };

      })

      .filter(function(item){

        return (
          item.artist &&
          item.title
        );

      });


    renderResults();

  }
  catch(error){

    if(
      error.name ===
      "AbortError"
    ){
      return;
    }


    console.error(error);


    document.getElementById("results")
      .innerHTML =
      '<div class="empty">검색에 실패했어요.</div>';

  }

}


/* =========================
   SEARCH DELAY
========================= */

function scheduleSearch(){

  clearTimeout(
    searchTimer
  );


  searchTimer =
    setTimeout(
      searchMusicBrainz,
      550
    );

}


/* =========================
   RESULTS
========================= */

function renderResults(){

  const box =
    document.getElementById("results");


  if(!searchResults.length){

    box.innerHTML =
      '<div class="empty">검색 결과가 없어요.</div>';

    return;

  }


  box.innerHTML =
    searchResults.map(
      function(song,index){

        return `

          <div
            class="result"
            onclick="selectResult(${index})"
          >

            <div class="result-icon">
              ♪
            </div>


            <div class="result-info">

              <div class="result-title">
                ${esc(song.artist)}
                -
                ${esc(song.title)}
              </div>


              <div class="result-album">
                ${esc(song.album)}
              </div>

            </div>


            <span class="result-time">
              ${esc(song.duration)}
            </span>

          </div>

        `;

      }
    ).join("");

}


/* =========================
   SELECT MUSICBRAINZ SONG
========================= */

function selectResult(index){

  const song =
    searchResults[index];


  if(!song){
    return;
  }


  const duplicate =
    songs.some(
      function(saved){

        return (
          saved.mbid &&
          saved.mbid === song.mbid
        );

      }
    );


  if(duplicate){

    alert(
      "이미 추가된 곡이에요."
    );

    return;

  }


  pendingSong = {

    mbid:
      song.mbid,

    artist:
      song.artist,

    title:
      song.title,

    album:
      song.album,

    duration:
      song.duration,

    cover:
      "",

    preview:
      ""

  };


  document.getElementById("results")
    .innerHTML =
    '<div class="empty">앨범 정보를 불러오는 중...</div>';


  searchItunesForSelected(
    pendingSong
  );

}


/* =========================
   ITUNES MATCH
========================= */

function searchItunesForSelected(song){

  const oldScript =
    document.getElementById(
      "itunesJsonpScript"
    );


  if(oldScript){

    oldScript.remove();

  }


  clearTimeout(
    itunesTimeout
  );


  const script =
    document.createElement(
      "script"
    );


  script.id =
    "itunesJsonpScript";


  const params =
    new URLSearchParams({

      term:
        song.artist
        +
        " "
        +
        song.title,

      country:
        "KR",

      media:
        "music",

      entity:
        "musicTrack",

      limit:
        "50",

      callback:
        "itunesMatchCallback",

      _:
        String(Date.now())

    });


  script.src =
    "https://itunes.apple.com/search?"
    +
    params.toString();


  script.onerror =
    function(){

      finishWithoutItunes();

      script.remove();

    };


  document.body.appendChild(
    script
  );


  itunesTimeout =
    setTimeout(
      finishWithoutItunes,
      8000
    );

}


/* =========================
   ITUNES CALLBACK
========================= */

window.itunesMatchCallback =
function(data){

  clearTimeout(
    itunesTimeout
  );


  const results =
    (
      data &&
      data.results
    )
    ?
    data.results.filter(
      function(item){

        return (
          item.artistName &&
          item.trackName
        );

      }
    )
    :
    [];


  let best = null;

  let bestScore = -1;


  const targetArtist =
    normalize(
      pendingSong.artist
    );


  const targetTitle =
    normalize(
      pendingSong.title
    );


  results.forEach(
    function(item){

      const artist =
        normalize(
          item.artistName
        );


      const title =
        normalize(
          item.trackName
        );


      let score = 0;


      if(
        title ===
        targetTitle
      ){

        score += 10;

      }
      else if(
        title.includes(
          targetTitle
        )
        ||
        targetTitle.includes(
          title
        )
      ){

        score += 5;

      }


      if(
        artist ===
        targetArtist
      ){

        score += 10;

      }
      else if(
        artist.includes(
          targetArtist
        )
        ||
        targetArtist.includes(
          artist
        )
      ){

        score += 4;

      }


      if(
        pendingSong.album &&
        item.collectionName
      ){

        const a =
          normalize(
            pendingSong.album
          );


        const b =
          normalize(
            item.collectionName
          );


        if(a === b){

          score += 3;

        }

      }


      if(score > bestScore){

        bestScore =
          score;

        best =
          item;

      }

    }
  );


  /*
    엉뚱한 곡을 억지로 붙이지 않기 위해
    최소 점수 이상일 때만 사용
  */

  if(
    best &&
    bestScore >= 10
  ){

    pendingSong.cover =
      (
        best.artworkUrl100 || ""
      )
      .replace(
        "100x100bb",
        "300x300bb"
      );


    pendingSong.preview =
      best.previewUrl || "";


    if(
      best.trackTimeMillis
    ){

      pendingSong.duration =
        formatTime(
          best.trackTimeMillis
        );

    }


    if(best.collectionName){

      pendingSong.album =
        best.collectionName;

    }

  }


  finishAdd();


  const script =
    document.getElementById(
      "itunesJsonpScript"
    );


  if(script){

    script.remove();

  }

};


/* =========================
   FALLBACK
========================= */

function finishWithoutItunes(){

  clearTimeout(
    itunesTimeout
  );


  finishAdd();


  const script =
    document.getElementById(
      "itunesJsonpScript"
    );


  if(script){

    script.remove();

  }

}


/* =========================
   FINISH ADD
========================= */

function finishAdd(){

  if(!pendingSong){
    return;
  }


  songs.push(
    pendingSong
  );


  pendingSong =
    null;


  renderSongs();

  closeSearch();

}


/* =========================
   EVENT
========================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    scheduleSearch
  );


renderSongs();

</script>

</body>
</html>
