<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Favorite Songs</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f7f9;
  color:#252525;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
}

.wrap{
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:18px 10px 50px;
}

.card{
  background:#fff;
  border:1px solid #e8e8eb;
  border-radius:14px;
  padding:12px;
}

.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

h1{
  margin:0;
  font-size:18px;
}

.count{
  color:#999;
  font-size:11px;
}


/* 곡 목록 */

.song{
  display:flex;
  align-items:center;
  gap:8px;
  height:52px;
  min-width:0;
  border-top:1px solid #f0f0f1;
}

.song:first-child{
  border-top:0;
}

.cover{
  width:38px;
  height:38px;
  flex:0 0 38px;
  object-fit:cover;
  border-radius:6px;
  background:#eee;
}

.song-info{
  flex:1;
  min-width:0;
}

.song-title{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:12px;
}

.duration{
  flex:0 0 auto;
  color:#929292;
  font-size:10px;
  font-variant-numeric:tabular-nums;
}

.play{
  width:29px;
  height:29px;
  flex:0 0 29px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 0 0 2px;

  border:0;
  border-radius:50%;

  background:#222;
  color:#fff;

  font-size:10px;
  cursor:pointer;
}

.play.playing{
  padding:0;
}

.add{
  width:100%;
  margin-top:9px;
  padding:9px;

  border:0;
  border-radius:9px;

  background:#f1f2f4;
  color:#333;

  font-size:11px;
  cursor:pointer;
}

.empty{
  padding:20px 0;
  color:#999;
  text-align:center;
  font-size:11px;
}


/* 검색창 */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;

  display:none;
  align-items:flex-end;
  justify-content:center;

  background:rgba(0,0,0,.35);
}

.overlay.open{
  display:flex;
}

.sheet{
  width:min(720px,100%);
  max-height:82vh;

  overflow:auto;

  padding:14px;

  background:#fff;
  border-radius:18px 18px 0 0;
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.sheet-title{
  font-size:14px;
  font-weight:700;
}

.close{
  padding:6px 9px;

  border:0;
  border-radius:8px;

  background:#f1f2f4;
  color:#333;

  font-size:11px;
  cursor:pointer;
}

.search{
  width:100%;
  padding:10px 11px;

  border:1px solid #ddd;
  border-radius:10px;

  outline:none;
  font-size:13px;
}

.search:focus{
  border-color:#aaa;
}

.hint{
  margin:7px 1px 9px;
  color:#999;
  font-size:10px;
}


/* 검색 결과 */

.result{
  display:flex;
  align-items:center;

  gap:8px;

  min-width:0;

  padding:7px 0;

  border-top:1px solid #f0f0f1;

  cursor:pointer;
}

.result:first-child{
  border-top:0;
}

.result-cover{
  width:42px;
  height:42px;
  flex:0 0 42px;

  object-fit:cover;

  border-radius:6px;
  background:#eee;
}

.result-info{
  flex:1;
  min-width:0;
}

.result-title{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  font-size:12px;
}

.result-album{
  margin-top:3px;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  color:#999;
  font-size:10px;
}

.result-time{
  flex:0 0 auto;

  color:#999;
  font-size:10px;
}


@media(max-width:460px){

  .wrap{
    padding:14px 10px 40px;
  }

  .card{
    padding:11px;
  }

  .song{
    height:48px;
    gap:7px;
  }

  .cover{
    width:35px;
    height:35px;
    flex-basis:35px;
  }

  .song-title{
    font-size:11px;
  }

  .play{
    width:27px;
    height:27px;
    flex-basis:27px;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <div class="head">

      <h1>
        좋아하는 곡
      </h1>

      <span
        class="count"
        id="count"
      >
        0곡
      </span>

    </div>


    <div id="songList"></div>


    <button
      class="add"
      type="button"
      onclick="openSearch()"
    >
      + 곡 추가
    </button>

  </div>

</div>



<!-- 검색 -->

<div
  class="overlay"
  id="overlay"
  onclick="overlayClick(event)"
>

  <div class="sheet">

    <div class="sheet-head">

      <div class="sheet-title">
        곡 추가
      </div>

      <button
        class="close"
        type="button"
        onclick="closeSearch()"
      >
        닫기
      </button>

    </div>


    <input
      class="search"
      id="searchInput"
      type="search"
      placeholder="아티스트 또는 곡명 검색"
      autocomplete="off"
    >


    <div class="hint">
      검색 결과를 누르면 바로 추가됩니다.
    </div>


    <div id="results">

      <div class="empty">
        곡을 검색해보세요.
      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   데이터
========================= */

let songs = [];

let searchResults = [];

let searchTimer = null;

let itunesTimeout = null;

let currentAudio = null;

let currentButton = null;


/* =========================
   HTML escape
========================= */

function esc(value=""){

  return String(value).replace(
    /[&<>"']/g,
    function(char){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char];

    }
  );

}


/* =========================
   시간
========================= */

function formatTime(ms){

  if(!ms){
    return "";
  }

  const seconds =
    Math.round(ms / 1000);

  const min =
    Math.floor(seconds / 60);

  const sec =
    String(seconds % 60)
      .padStart(2,"0");

  return min + ":" + sec;

}


/* =========================
   곡 목록
========================= */

function renderSongs(){

  const list =
    document.getElementById("songList");


  document.getElementById("count")
    .textContent =
    songs.length + "곡";


  if(!songs.length){

    list.innerHTML =
      '<div class="empty">아직 추가한 곡이 없어요.</div>';

    return;

  }


  list.innerHTML =
    songs.map(function(song,index){

      return `

        <div class="song">

          <img
            class="cover"
            src="${esc(song.cover)}"
            alt=""
          >

          <div class="song-info">

            <div class="song-title">
              ${esc(song.artist)} - ${esc(song.title)}
            </div>

          </div>

          <span class="duration">
            ${esc(song.duration)}
          </span>

          <button
            class="play"
            type="button"
            onclick="playSong(${index},this)"
            aria-label="재생"
          >
            ▶
          </button>

        </div>

      `;

    }).join("");

}


/* =========================
   재생
========================= */

function stopCurrent(){

  if(currentAudio){

    currentAudio.pause();
    currentAudio = null;

  }


  if(currentButton){

    currentButton.textContent = "▶";

    currentButton.classList.remove(
      "playing"
    );

    currentButton = null;

  }

}


function playSong(index,button){

  const song =
    songs[index];


  if(!song.preview){

    alert("이 곡은 미리듣기를 제공하지 않아요.");

    return;

  }


  if(
    currentAudio &&
    currentButton === button
  ){

    if(currentAudio.paused){

      currentAudio.play();

      button.textContent = "Ⅱ";

      button.classList.add(
        "playing"
      );

    }else{

      currentAudio.pause();

      button.textContent = "▶";

      button.classList.remove(
        "playing"
      );

    }

    return;

  }


  stopCurrent();


  currentAudio =
    new Audio(song.preview);


  currentButton =
    button;


  currentAudio.play()
    .then(function(){

      button.textContent = "Ⅱ";

      button.classList.add(
        "playing"
      );

    })
    .catch(function(){

      stopCurrent();

      alert("미리듣기를 재생하지 못했어요.");

    });


  currentAudio.addEventListener(
    "ended",
    stopCurrent
  );

}


/* =========================
   검색창 열기/닫기
========================= */

function openSearch(){

  document.getElementById("overlay")
    .classList.add("open");


  const input =
    document.getElementById("searchInput");


  input.value = "";


  searchResults = [];


  document.getElementById("results")
    .innerHTML =
    '<div class="empty">곡을 검색해보세요.</div>';


  setTimeout(function(){

    input.focus();

  },100);

}


function closeSearch(){

  document.getElementById("overlay")
    .classList.remove("open");

}


function overlayClick(event){

  if(event.target.id === "overlay"){

    closeSearch();

  }

}


/* ======================================
   실제 작동 확인했던 iTunes JSONP 방식
====================================== */

window.wsSearchCB = function(data){

  clearTimeout(itunesTimeout);


  try{

    searchResults =
      (
        data &&
        Array.isArray(data.results)
        ?
        data.results
        :
        []
      )

      .filter(function(item){

        return (
          item.wrapperType === "track" ||
          item.kind === "song"
        );

      })

      .filter(function(item){

        return (
          item.artistName &&
          item.trackName
        );

      })

      .map(function(item){

        return {

          id:
            item.trackId || "",

          artist:
            item.artistName || "",

          title:
            item.trackName || "",

          album:
            item.collectionName || "",

          cover:
            (
              item.artworkUrl100 || ""
            )
            .replace(
              "100x100bb",
              "300x300bb"
            ),

          duration:
            formatTime(
              item.trackTimeMillis
            ),

          preview:
            item.previewUrl || "",

          trackViewUrl:
            item.trackViewUrl || ""

        };

      });


    renderResults();

  }
  catch(error){

    console.error(error);

    document.getElementById("results")
      .innerHTML =
      '<div class="empty">검색 결과를 불러오지 못했어요.</div>';

  }


  const script =
    document.getElementById(
      "itunesJsonpScript"
    );


  if(script){

    script.remove();

  }

};


/* =========================
   검색 실행
========================= */

function searchItunes(){

  const q =
    document.getElementById("searchInput")
      .value
      .trim();


  if(!q){

    searchResults = [];

    document.getElementById("results")
      .innerHTML =
      '<div class="empty">곡을 검색해보세요.</div>';

    return;

  }


  document.getElementById("results")
    .innerHTML =
    '<div class="empty">검색 중...</div>';


  const oldScript =
    document.getElementById(
      "itunesJsonpScript"
    );


  if(oldScript){

    oldScript.remove();

  }


  clearTimeout(itunesTimeout);


  const params =
    new URLSearchParams({

      term:q,

      country:"KR",

      media:"music",

      entity:"musicTrack",

      limit:"20",

      callback:"wsSearchCB",

      _:String(Date.now())

    });


  const script =
    document.createElement("script");


  script.id =
    "itunesJsonpScript";


  script.src =
    "https://itunes.apple.com/search?"
    +
    params.toString();


  script.onerror = function(){

    clearTimeout(itunesTimeout);


    document.getElementById("results")
      .innerHTML =
      '<div class="empty">검색에 실패했어요.</div>';


    script.remove();

  };


  document.body.appendChild(
    script
  );


  itunesTimeout =
    setTimeout(function(){

      const result =
        document.getElementById(
          "results"
        );


      if(
        result.textContent.includes(
          "검색 중"
        )
      ){

        result.innerHTML =
          '<div class="empty">검색 응답이 없어요.</div>';

      }

    },8000);

}


/* =========================
   입력 디바운스
========================= */

function scheduleSearch(){

  clearTimeout(searchTimer);


  searchTimer =
    setTimeout(
      searchItunes,
      450
    );

}


/* =========================
   검색 결과 표시
========================= */

function renderResults(){

  const box =
    document.getElementById("results");


  if(!searchResults.length){

    box.innerHTML =
      '<div class="empty">검색 결과가 없어요.</div>';

    return;

  }


  box.innerHTML =
    searchResults.map(function(song,index){

      return `

        <div
          class="result"
          onclick="addSong(${index})"
        >

          <img
            class="result-cover"
            src="${esc(song.cover)}"
            alt=""
          >

          <div class="result-info">

            <div class="result-title">
              ${esc(song.artist)} - ${esc(song.title)}
            </div>

            <div class="result-album">
              ${esc(song.album)}
            </div>

          </div>

          <span class="result-time">
            ${esc(song.duration)}
          </span>

        </div>

      `;

    }).join("");

}


/* =========================
   곡 추가
========================= */

function addSong(index){

  const song =
    searchResults[index];


  if(!song){
    return;
  }


  const exists =
    songs.some(function(saved){

      if(
        song.id &&
        saved.id &&
        String(saved.id) === String(song.id)
      ){

        return true;

      }


      return (
        saved.artist === song.artist &&
        saved.title === song.title
      );

    });


  if(exists){

    alert("이미 추가된 곡이에요.");

    return;

  }


  songs.push({

    id:song.id,

    artist:song.artist,

    title:song.title,

    album:song.album,

    cover:song.cover,

    duration:song.duration,

    preview:song.preview,

    trackViewUrl:song.trackViewUrl

  });


  renderSongs();

  closeSearch();

}


/* =========================
   검색 입력 이벤트
========================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    scheduleSearch
  );


renderSongs();

</script>

</body>
</html>
