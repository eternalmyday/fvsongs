<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Favorite Songs</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f7f9;
  color:#252525;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
}

.wrap{
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:18px 10px 50px;
}

.card{
  background:#fff;
  border:1px solid #e8e8eb;
  border-radius:14px;
  padding:12px;
  box-shadow:0 3px 14px rgba(0,0,0,.025);
}

.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}

h1{
  margin:0;
  font-size:18px;
}

.count{
  color:#90949a;
  font-size:11px;
}


/* =====================
   PLAYLIST
===================== */

.song-list{
  width:100%;
}

.song{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
  height:52px;
  border-top:1px solid #f0f0f1;
}

.song:first-child{
  border-top:0;
}

.cover{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:6px;
  object-fit:cover;
  background:#eee;
}

.song-info{
  flex:1;
  min-width:0;
}

.song-title{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:12px;
  line-height:1.3;
}

.duration{
  flex:0 0 auto;
  color:#8b8f95;
  font-size:10.5px;
  font-variant-numeric:tabular-nums;
}

.play{
  width:29px;
  height:29px;
  flex:0 0 29px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;
  border-radius:50%;

  background:#222;
  color:#fff;

  padding:0 0 0 2px;

  font-size:10px;

  cursor:pointer;
}

.play.playing{
  padding:0;
}

.add{
  width:100%;

  margin-top:9px;
  padding:9px;

  border:0;
  border-radius:9px;

  background:#f1f2f4;
  color:#333;

  font-size:11px;

  cursor:pointer;
}

.empty{
  padding:18px 0;
  color:#999;
  text-align:center;
  font-size:11px;
}


/* =====================
   SEARCH SHEET
===================== */

.overlay{
  position:fixed;
  inset:0;

  z-index:20;

  display:none;

  align-items:flex-end;
  justify-content:center;

  background:rgba(0,0,0,.34);
}

.overlay.open{
  display:flex;
}

.sheet{
  width:min(720px,100%);
  max-height:82vh;

  overflow:auto;

  padding:14px;

  background:#fff;

  border-radius:18px 18px 0 0;
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:10px;
}

.sheet-title{
  font-size:14px;
  font-weight:700;
}

.close{
  border:0;
  border-radius:8px;

  padding:6px 9px;

  background:#f1f2f4;
  color:#333;

  font-size:11px;

  cursor:pointer;
}

.search{
  width:100%;

  border:1px solid #dedfe3;
  border-radius:10px;

  padding:10px 11px;

  outline:none;

  font-size:13px;
}

.hint{
  margin:7px 1px 9px;

  color:#999;

  font-size:10px;
}


/* =====================
   SEARCH RESULTS
===================== */

.result{
  display:flex;
  align-items:center;

  gap:9px;

  min-width:0;

  padding:8px 0;

  border-top:1px solid #f0f0f1;

  cursor:pointer;
}

.result:first-child{
  border-top:0;
}

.result .cover{
  width:42px;
  height:42px;
  flex-basis:42px;
}

.result-info{
  min-width:0;
  flex:1;
}

.result-title{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  font-size:12px;
}

.result-album{
  margin-top:3px;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  color:#92969c;

  font-size:10px;
}

.result-time{
  flex:0 0 auto;

  color:#92969c;

  font-size:10px;
}


/* =====================
   MOBILE
===================== */

@media(max-width:460px){

  .wrap{
    padding:14px 10px 40px;
  }

  .card{
    padding:11px;
  }

  .song{
    height:48px;
    gap:7px;
  }

  .cover{
    width:35px;
    height:35px;
    flex-basis:35px;
  }

  .song-title{
    font-size:11px;
  }

  .duration{
    font-size:10px;
  }

  .play{
    width:27px;
    height:27px;
    flex-basis:27px;
  }

  .result{
    gap:8px;
  }

  .result .cover{
    width:39px;
    height:39px;
    flex-basis:39px;
  }
}
</style>
</head>

<body>


<div class="wrap">

  <section class="card">

    <div class="head">

      <h1>
        좋아하는 곡
      </h1>

      <span
        class="count"
        id="count"
      ></span>

    </div>


    <div
      class="song-list"
      id="songList"
    ></div>


    <button
      class="add"
      onclick="openSearch()"
    >
      + 곡 추가
    </button>

  </section>

</div>



<!-- SEARCH -->

<div
  class="overlay"
  id="overlay"
  onclick="overlayClose(event)"
>

  <div class="sheet">

    <div class="sheet-head">

      <div class="sheet-title">
        곡 추가
      </div>

      <button
        class="close"
        onclick="closeSearch()"
      >
        닫기
      </button>

    </div>


    <input
      id="searchInput"
      class="search"
      type="text"
      placeholder="아티스트 또는 곡명 검색"
      autocomplete="off"
    >


    <div class="hint">
      원하는 곡을 선택하면 바로 추가됩니다.
    </div>


    <div id="results">

      <div class="empty">
        아티스트 또는 곡명을 검색하세요.
      </div>

    </div>

  </div>

</div>



<script>

/* =====================
   DATA
===================== */

let songs = [

  {
    artist:"DAY6",
    title:"HAPPY",
    duration:"3:09",

    cover:
    "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/2a/02/f8/2a02f8f9-7813-8d70-97b8-d609dc4bc370/888272125223_Cover.jpg/300x300bb.jpg",

    preview:""
  },

  {
    artist:"DAY6",
    title:"Welcome to the Show",
    duration:"3:38",

    cover:
    "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/fb/72/3d/fb723d0c-e15f-bf40-8e66-0e171d85af72/888272123533_Cover.jpg/300x300bb.jpg",

    preview:""
  },

  {
    artist:"aespa",
    title:"Whiplash",
    duration:"3:03",

    cover:
    "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/73/59/a0/7359a0c9-24e6-e896-2cff-fdb675348868/8804775451602.jpg/300x300bb.jpg",

    preview:""
  }

];


let searchResults = [];

let searchTimer = null;

let searchTimeout = null;

let currentAudio = null;

let currentButton = null;


/* =====================
   UTILS
===================== */

function esc(s=""){

  return String(s).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


function formatTime(ms){

  if(!ms){
    return "";
  }

  const total =
    Math.round(
      ms / 1000
    );

  const min =
    Math.floor(
      total / 60
    );

  const sec =
    String(
      total % 60
    ).padStart(
      2,
      "0"
    );

  return `${min}:${sec}`;

}


/* =====================
   PLAYLIST
===================== */

function renderSongs(){

  const list =
    document.getElementById(
      "songList"
    );


  document.getElementById(
    "count"
  ).textContent =
    songs.length + "곡";


  if(!songs.length){

    list.innerHTML =
      `
      <div class="empty">
        아직 추가한 곡이 없어요.
      </div>
      `;

    return;

  }


  list.innerHTML =
    songs.map(
      (song,index)=>`

      <div class="song">

        <img
          class="cover"
          src="${esc(song.cover)}"
          alt=""
        >


        <div class="song-info">

          <div class="song-title">
            ${esc(song.artist)}
            -
            ${esc(song.title)}
          </div>

        </div>


        <span class="duration">
          ${esc(song.duration)}
        </span>


        <button
          class="play"
          onclick="playSong(${index},this)"
          aria-label="재생"
        >
          ▶
        </button>

      </div>

      `
    ).join("");

}


/* =====================
   AUDIO
===================== */

function resetPlayer(){

  if(currentAudio){

    currentAudio.pause();

    currentAudio =
      null;

  }


  if(currentButton){

    currentButton.textContent =
      "▶";

    currentButton.classList.remove(
      "playing"
    );

    currentButton =
      null;

  }

}


function playSong(index,button){

  const song =
    songs[index];


  if(!song.preview){

    alert(
      "이 곡은 제공되는 미리듣기가 없어요."
    );

    return;

  }


  if(
    currentAudio
    &&
    currentButton === button
  ){

    if(
      currentAudio.paused
    ){

      currentAudio.play();

      button.textContent =
        "Ⅱ";

      button.classList.add(
        "playing"
      );

    }else{

      currentAudio.pause();

      button.textContent =
        "▶";

      button.classList.remove(
        "playing"
      );

    }

    return;

  }


  resetPlayer();


  currentAudio =
    new Audio(
      song.preview
    );


  currentButton =
    button;


  currentAudio.play();


  button.textContent =
    "Ⅱ";


  button.classList.add(
    "playing"
  );


  currentAudio.addEventListener(
    "ended",
    resetPlayer
  );

}


/* =====================
   SEARCH MODAL
===================== */

function openSearch(){

  document
    .getElementById("overlay")
    .classList.add("open");


  document
    .getElementById("searchInput")
    .value =
    "";


  document
    .getElementById("results")
    .innerHTML =
    `
    <div class="empty">
      아티스트 또는 곡명을 검색하세요.
    </div>
    `;


  setTimeout(
    ()=>{

      document
        .getElementById(
          "searchInput"
        )
        .focus();

    },
    100
  );

}


function closeSearch(){

  document
    .getElementById("overlay")
    .classList.remove("open");

}


function overlayClose(event){

  if(
    event.target.id ===
    "overlay"
  ){

    closeSearch();

  }

}


/* =====================
   iTUNES JSONP
===================== */

window.playlistSearchCallback =
function(data){

  clearTimeout(
    searchTimeout
  );


  try{

    const raw =
      data && data.results
      ?
      data.results
      :
      [];


    const seen =
      new Set();


    searchResults =
      raw

      .filter(
        item=>
          item.kind === "song"
          &&
          item.artistName
          &&
          item.trackName
      )

      .map(
        item=>({

          id:
            item.trackId || "",

          artist:
            item.artistName || "",

          title:
            item.trackName || "",

          album:
            item.collectionName || "",

          duration:
            formatTime(
              item.trackTimeMillis
            ),

          cover:
            (
              item.artworkUrl100
              ||
              ""
            )
            .replace(
              "100x100bb",
              "300x300bb"
            ),

          preview:
            item.previewUrl || ""

        })
      )

      .filter(
        song=>{

          const key =
            song.id
            ||
            (
              song.artist
              +
              "|||"
              +
              song.title
              +
              "|||"
              +
              song.album
            );


          if(
            seen.has(key)
          ){

            return false;

          }


          seen.add(key);

          return true;

        }
      );


    renderResults();

  }catch(error){

    console.error(error);


    document
      .getElementById(
        "results"
      )
      .innerHTML =
      `
      <div class="empty">
        검색 결과를 처리하지 못했어요.
      </div>
      `;

  }


  const script =
    document.getElementById(
      "itunesSearchScript"
    );


  if(script){

    script.remove();

  }

};


/* =====================
   SEARCH
===================== */

function searchSongs(){

  const query =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim();


  if(!query){

    searchResults =
      [];


    document
      .getElementById(
        "results"
      )
      .innerHTML =
      `
      <div class="empty">
        아티스트 또는 곡명을 검색하세요.
      </div>
      `;


    return;

  }


  document
    .getElementById(
      "results"
    )
    .innerHTML =
    `
    <div class="empty">
      검색 중…
    </div>
    `;


  const old =
    document.getElementById(
      "itunesSearchScript"
    );


  if(old){

    old.remove();

  }


  clearTimeout(
    searchTimeout
  );


  const script =
    document.createElement(
      "script"
    );


  script.id =
    "itunesSearchScript";


  const params =
    new URLSearchParams({

      term:
        query,

      country:
        "KR",

      media:
        "music",

      entity:
        "musicTrack",

      limit:
        "100",

      callback:
        "playlistSearchCallback",

      _:
        String(
          Date.now()
        )

    });


  script.src =
    "https://itunes.apple.com/search?"
    +
    params.toString();


  script.onerror =
    function(){

      clearTimeout(
        searchTimeout
      );


      document
        .getElementById(
          "results"
        )
        .innerHTML =
        `
        <div class="empty">
          검색 API를 불러오지 못했어요.
        </div>
        `;


      script.remove();

    };


  searchTimeout =
    setTimeout(
      ()=>{

        const result =
          document.getElementById(
            "results"
          );


        if(
          result.textContent.includes(
            "검색 중"
          )
        ){

          result.innerHTML =
            `
            <div class="empty">
              검색 응답이 없어요.
            </div>
            `;

        }

      },
      7000
    );


  document.body.appendChild(
    script
  );

}


function scheduleSearch(){

  clearTimeout(
    searchTimer
  );


  searchTimer =
    setTimeout(
      searchSongs,
      450
    );

}


/* =====================
   SEARCH RESULTS
===================== */

function renderResults(){

  const el =
    document.getElementById(
      "results"
    );


  if(
    !searchResults.length
  ){

    el.innerHTML =
      `
      <div class="empty">
        검색 결과 없음
      </div>
      `;

    return;

  }


  el.innerHTML =
    searchResults.map(
      (song,index)=>`

      <div
        class="result"
        onclick="addSearchResult(${index})"
      >

        <img
          class="cover"
          src="${esc(song.cover)}"
          alt=""
        >


        <div class="result-info">

          <div class="result-title">
            ${esc(song.artist)}
            -
            ${esc(song.title)}
          </div>


          <div class="result-album">
            ${esc(song.album)}
          </div>

        </div>


        <span class="result-time">
          ${esc(song.duration)}
        </span>

      </div>

      `
    ).join("");

}


/* =====================
   ADD
===================== */

function addSearchResult(index){

  const song =
    searchResults[index];


  if(!song){

    return;

  }


  const duplicate =
    songs.some(
      item=>
        (
          song.id
          &&
          item.id === song.id
        )
        ||
        (
          item.artist ===
          song.artist

          &&

          item.title ===
          song.title
        )
    );


  if(duplicate){

    alert(
      "이미 추가된 곡이에요."
    );

    return;

  }


  songs.push({

    id:
      song.id,

    artist:
      song.artist,

    title:
      song.title,

    duration:
      song.duration,

    cover:
      song.cover,

    preview:
      song.preview

  });


  renderSongs();

  closeSearch();

}


/* =====================
   EVENTS
===================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    scheduleSearch
  );


renderSongs();

</script>

</body>
</html>
